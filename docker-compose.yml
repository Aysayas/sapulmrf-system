# Local development stack: PostgreSQL 16, FastAPI (Python 3.12), React/Vite and Adminer.
# Source folders are mounted, so api and web reload on save. Every port listens on 127.0.0.1 only.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME:?set DB_NAME in .env}
      POSTGRES_USER: ${DB_USER:?set DB_USER in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${DB_FORWARD_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: ./api
    image: sapulmrf-api:dev  # worker and sim run this same image, so it is built and stored once
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      WATCHFILES_FORCE_POLLING: "true"  # file changes from Windows don't reach the container as events
      OLLAMA_URL: ${OLLAMA_URL:-}  # set to http://ollama:11434 to turn on AI report summaries
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b}
    ports:
      - "127.0.0.1:${API_PORT:-8001}:8000"
    volumes:
      - ./api:/app
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    # Runs the alert checks every 30 s (compost out of range, devices gone silent, storage almost full)
    # and saves the day's intake forecasts once a day.
    image: sapulmrf-api:dev
    pull_policy: never
    command: python -m app.alerts.worker
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
    volumes:
      - ./api:/app
    depends_on:
      db:
        condition: service_healthy

  web:
    image: node:22
    working_dir: /web
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      API_URL: http://api:8000
    ports:
      - "127.0.0.1:${WEB_PORT:-5174}:5173"
    volumes:
      - ./web:/web
      - web_node_modules:/web/node_modules
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5173').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 30

  sim:
    # Stands in for the devices and an operator. Only runs when asked: docker compose --profile sim up -d sim
    profiles: ["sim"]
    image: sapulmrf-api:dev
    pull_policy: never
    command: python -m app.simulator run
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      API_BASE: http://api:8000
      E2E_ADMIN_USERNAME: ${E2E_ADMIN_USERNAME:-}
      E2E_ADMIN_PASSWORD: ${E2E_ADMIN_PASSWORD:-}
      SIM_PACE: ${SIM_PACE:-1}
    volumes:
      - ./api:/app
      - sim_state:/state
    depends_on:
      api:
        condition: service_healthy

  ollama:
    # Local LLM for the optional AI report summaries. Only runs when asked: docker compose --profile ai up -d ollama
    profiles: ["ai"]
    image: ollama/ollama:0.12.6
    # Load the model and answer once at start-up (1–3 min): a load alone leaves its CPU part on disk until the first answer.
    # /tmp/ready appears when it's warm.
    entrypoint: ["/bin/sh", "-c", "ollama serve & until ollama list >/dev/null 2>&1; do sleep 1; done; ollama run ${OLLAMA_MODEL:-qwen2.5:7b} 'Say OK.' </dev/null >/dev/null 2>&1; touch /tmp/ready; wait"]
    environment:
      OLLAMA_KEEP_ALIVE: "-1"  # loading the model takes ~50 s on a 6 GB laptop GPU, so keep it loaded (holds ~4.6 GB)
      OLLAMA_MAX_LOADED_MODELS: "1"
    volumes:
      - ollama_models:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  adminer:
    image: adminer:4
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "127.0.0.1:${ADMINER_PORT:-8081}:8080"
    depends_on:
      - db

volumes:
  db_data:
  web_node_modules:
  sim_state:
  ollama_models:
