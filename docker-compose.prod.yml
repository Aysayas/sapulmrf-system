# Production stack for the home server. See docs/deployment.md.
# docker compose -p sapulmrf -f docker-compose.prod.yml --env-file .env.prod up -d
# No source mounts, no Adminer or simulator, and only Caddy is reachable from outside.
x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "10m"  # so logs can't fill the server's disk
      max-file: "3"

x-api-env: &api-env
  DATABASE_URL: postgresql+psycopg://${DB_USER:?set DB_USER}:${DB_PASSWORD:?set DB_PASSWORD}@db:5432/${DB_NAME:?set DB_NAME}
  COOKIE_SECURE: "true"

services:
  db:
    <<: *logging
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    <<: *logging
    build: ./api
    image: sapulmrf-api:prod
    restart: unless-stopped
    # Only Caddy can reach this port, so its forwarded address can be trusted for the login limit.
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips=*
    environment: *api-env
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    <<: *logging
    image: sapulmrf-api:prod
    pull_policy: never
    restart: unless-stopped
    command: python -m app.alerts.worker
    environment: *api-env
    depends_on:
      api:
        condition: service_healthy

  web:
    <<: *logging
    build:
      context: ./web
      dockerfile: Dockerfile.prod
    image: sapulmrf-web:prod
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - caddy_data:/data  # certificates; lose this and browsers must trust a new one
    depends_on:
      api:
        condition: service_healthy

  backup:
    <<: *logging
    image: postgres:16
    restart: unless-stopped
    command: ["sh", "/backup-loop.sh"]
    environment:
      TZ: Asia/Manila
      PGHOST: db
      PGDATABASE: ${DB_NAME}
      PGUSER: ${DB_USER}
      PGPASSWORD: ${DB_PASSWORD}
      KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./scripts/backup.sh:/backup.sh:ro
      - ./scripts/backup-loop.sh:/backup-loop.sh:ro
      - ${BACKUP_DIR:-./backups}:/backups
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
  caddy_data:
