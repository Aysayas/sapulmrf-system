[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["migrations/versions"]  # generated by Alembic

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency style: Depends()/Query() in defaults is intended.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
