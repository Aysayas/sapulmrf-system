name: CI
on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_DB: sapulmrf
          POSTGRES_USER: sapulmrf
          POSTGRES_PASSWORD: ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sapulmrf" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://sapulmrf:ci-only@localhost:5432/sapulmrf
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: ruff check .
      - run: pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run build

  e2e:
    name: Browser tests
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      - name: Write a CI-only .env
        run: |
          cp .env.example .env
          sed -i "s/^DB_PASSWORD=.*/DB_PASSWORD=ci-$(openssl rand -hex 8)/" .env
          sed -i "s/^E2E_ADMIN_PASSWORD=.*/E2E_ADMIN_PASSWORD=ci-$(openssl rand -hex 12)/" .env
      - run: docker compose up -d --build --wait
      - run: docker compose exec -T api alembic upgrade head
      - name: Create the test admin
        run: |
          set -a; . ./.env; set +a
          docker compose exec -T -e E2E_ADMIN_PASSWORD api python -c "import os; from app.core.db import SessionLocal; from app.cli import create_admin; create_admin(SessionLocal(), 'Test Admin', 'e2e.admin', os.environ['E2E_ADMIN_PASSWORD'])"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run test:e2e -- --reporter=list
        working-directory: web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7
